<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0D10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vai Pra Cima">
<meta name="description" content="Vai Pra Cima: a ponte entre você e o seu futuro. Encontre peneiras de futebol e futsal em São Paulo.">
<title>Vai Pra Cima 1.0 beta</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.app{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.4}
.app *{box-sizing:border-box}
.t-escuro{--bg:#0B0D10;--s1:#16191F;--s2:#20242B;--ln:#2C313A;--tx:#F4F6F8;--mu:#A3ABB6;--hot:#FF8A63;--ov:rgba(0,0,0,.62)}
.t-claro,.t-sistema{--bg:#F2F3EE;--s1:#FFFFFF;--s2:#E6E8E1;--ln:#D4D7CD;--tx:#0E1012;--mu:#525A64;--hot:#B3340C;--ov:rgba(14,16,18,.42)}
.a-lima{--ac:#C6FF34;--acx:#0B0D10;--act:#C6FF34}
.a-ciano{--ac:#46E3FF;--acx:#0B0D10;--act:#46E3FF}
.a-laranja{--ac:#FF9A2E;--acx:#0B0D10;--act:#FF9A2E}
.t-claro.a-lima,.t-sistema.a-lima{--act:#3A6600}
.t-claro.a-ciano,.t-sistema.a-ciano{--act:#00677D}
.t-claro.a-laranja,.t-sistema.a-laranja{--act:#9A4600}
@media (prefers-color-scheme:dark){
.t-sistema{--bg:#0B0D10;--s1:#16191F;--s2:#20242B;--ln:#2C313A;--tx:#F4F6F8;--mu:#A3ABB6;--hot:#FF8A63;--ov:rgba(0,0,0,.62)}
.t-sistema.a-lima,.t-sistema.a-ciano,.t-sistema.a-laranja{--act:var(--ac)}
.t-sistema .map .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.85)}
}
.disp{font-family:'Bricolage Grotesque','Inter',system-ui,sans-serif;letter-spacing:-.02em}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.f{fill:currentColor}
.ic.sm{width:16px;height:16px}
.ic.lg{width:26px;height:26px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;border:0;background:none;padding:0;transition:transform .14s ease,background-color .2s,color .2s,border-color .2s,opacity .2s}
button:active{transform:scale(.96)}
button:disabled{cursor:default;opacity:.5}
button:disabled:active{transform:none}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--act);outline-offset:2px}
@keyframes fwd{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes bk{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
@keyframes shIn{from{transform:translateY(100%)}to{transform:none}}
@keyframes shOut{to{transform:translateY(100%)}}
@keyframes pop{0%{opacity:0;transform:scale(.5) rotate(-8deg)}65%{opacity:1;transform:scale(1.08) rotate(2deg)}100%{transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes ping{0%{transform:scale(1);opacity:.55}100%{transform:scale(2.6);opacity:0}}
@keyframes drift{0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-6px) rotate(var(--r))}}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;animation:fwd .34s cubic-bezier(.2,.8,.2,1) both}
.scr.bk{animation-name:bk}
.in{animation:up .4s cubic-bezier(.2,.8,.2,1) both}
.fade{animation:fade .28s ease both}
.body{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.pad{padding:0 20px}
.top{display:flex;align-items:center;gap:10px;padding:16px 16px 8px;min-height:64px}
.ibtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--s2);position:relative;flex:none}
.dot{position:absolute;top:6px;right:6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--hot);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--s2)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.h1{font-size:34px;line-height:1.02;font-weight:800;margin:0}
.h2{font-size:22px;line-height:1.1;font-weight:800;margin:0}
.mu{color:var(--mu)}
.act{color:var(--act)}
.btn{height:56px;border-radius:18px;background:var(--ac);color:var(--acx);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:0 20px}
.btn.ghost{background:var(--s2);color:var(--tx)}
.btn.sm{height:46px;font-size:14px;border-radius:14px}
.lnk{color:var(--act);font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:28px}
.lbl{font-size:13px;font-weight:700;color:var(--mu);margin:0 0 8px;display:block}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;background:var(--s2);padding:5px;border-radius:16px}
.seg button{height:46px;border-radius:12px;font-weight:700;color:var(--mu)}
.seg button.on{background:var(--tx);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipx{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 16px}
.chipx::-webkit-scrollbar{display:none}
.chip{height:40px;padding:0 14px;border-radius:20px;border:1.5px solid var(--ln);background:transparent;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.chip .n{background:var(--ac);color:var(--acx);border-radius:10px;min-width:20px;height:20px;font-size:12px;display:grid;place-items:center;padding:0 6px}
.inp{width:100%;height:52px;border-radius:14px;border:1.5px solid var(--ln);background:var(--s1);color:var(--tx);font:inherit;font-size:16px;padding:0 14px;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--act)}
.field{display:flex;flex-direction:column}
.err{color:var(--hot);font-size:13px;font-weight:600}
.splash{position:absolute;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;width:100%}
.logo{width:96px;height:96px;border-radius:30px;background:var(--ac);color:var(--acx);display:grid;place-items:center;animation:pop .7s cubic-bezier(.2,.8,.2,1) both}
.logo .ic{width:52px;height:52px;stroke-width:3}
.rise{animation:up .5s .25s cubic-bezier(.2,.8,.2,1) both}
.rise2{animation:up .5s .4s cubic-bezier(.2,.8,.2,1) both}
.ld{width:120px;height:4px;border-radius:2px;background:var(--s2);overflow:hidden;margin-top:12px}
.ld i{display:block;height:100%;background:var(--ac);transform-origin:left;animation:grow 1.5s .2s ease both}
.tilt{display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:18px;font-weight:700;font-size:14px;animation:drift 4s ease-in-out infinite}
.role{display:flex;align-items:center;gap:14px;padding:18px;border-radius:22px;background:var(--s1);border:1.5px solid var(--ln);text-align:left;width:100%}
.role.main{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.role .rk{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:rgba(127,127,127,.16);flex:none}
.role.main .rk{background:rgba(11,13,16,.12)}
.yr{display:flex;align-items:center;gap:12px;background:var(--s1);border:1.5px solid var(--ln);border-radius:20px;padding:10px}
.yr .ibtn{width:48px;height:48px;font-size:22px;font-weight:700}
.tabs{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--s2);border-radius:16px;padding:4px}
.tabs .ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px) / 4);border-radius:12px;background:var(--tx);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.tabs .ind.p1{transform:translateX(100%)}
.tabs .ind.p2{transform:translateX(200%)}
.tabs .ind.p3{transform:translateX(300%)}
.tn{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--ac);color:var(--acx);font-size:11px;font-weight:800;display:inline-grid;place-items:center}
.card.past{opacity:.6}
.tabs button{position:relative;z-index:1;height:42px;font-weight:700;font-size:13px;color:var(--mu);display:flex;align-items:center;justify-content:center;gap:6px}
.tabs button.on{color:var(--bg)}
.card{position:relative;border-radius:22px;background:var(--s1);border:1.5px solid var(--ln);animation:up .4s cubic-bezier(.2,.8,.2,1) both}
.card.soon{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 10%,var(--s1))}
.cm{display:flex;gap:14px;padding:14px 56px 14px 14px;text-align:left;width:100%;border-radius:22px}
.dt{width:62px;flex:none;border-radius:16px;background:var(--s2);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 0}
.soon .dt,.dt.hl{background:var(--ac);color:var(--acx)}
.dt .w{font-size:11px;font-weight:800;letter-spacing:.06em}
.dt .d{font-size:28px;line-height:1;font-weight:800}
.dt .m{font-size:11px;font-weight:700;letter-spacing:.06em}
.tg{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:12px;background:var(--s2);font-size:12px;font-weight:600}
.tg.warn{background:transparent;border:1.5px solid var(--hot);color:var(--hot)}
.tg.ok{background:var(--ac);color:var(--acx)}
.bar{height:6px;border-radius:3px;background:var(--s2);overflow:hidden;flex:1}
.bar i{display:block;height:100%;border-radius:3px;background:var(--tx);transform-origin:left;animation:grow .7s .15s cubic-bezier(.2,.8,.2,1) both}
.fav{position:absolute;top:8px;right:8px;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--mu)}
.fav.on{color:var(--hot)}
.map{position:relative;z-index:0;width:100%;height:min(58vh,420px);border-radius:22px;background:var(--s2);border:1.5px solid var(--ln);overflow:hidden;font-family:inherit}
.map .leaflet-control-attribution{font-size:10px;background:color-mix(in srgb,var(--bg) 82%,transparent);color:var(--mu)}
.map .leaflet-control-attribution a{color:var(--mu)}
.map .leaflet-bar{border:1.5px solid var(--ln);border-radius:12px;overflow:hidden;box-shadow:none}
.map .leaflet-bar a{width:36px;height:36px;line-height:34px;background:var(--s1);color:var(--tx);border-color:var(--ln)}
.t-escuro .map .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.85)}
.vpc-ic{background:none;border:0}
.pin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);min-width:32px;height:32px;padding:0 8px;border-radius:16px;background:var(--tx);color:var(--bg);font:800 13px/28px 'Inter',system-ui,sans-serif;text-align:center;border:2px solid var(--bg);box-shadow:0 4px 12px rgba(0,0,0,.25);cursor:pointer;animation:pop .45s cubic-bezier(.2,.8,.2,1) both}
.pin.hot{background:var(--ac);color:var(--acx)}
.pin.sel{outline:3px solid var(--act);outline-offset:2px}
.me{position:absolute;left:50%;top:50%;width:16px;height:16px;border-radius:8px;background:#2F7BFF;border:2px solid #fff;transform:translate(-50%,-50%);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.me::after{content:'';position:absolute;inset:-2px;border-radius:50%;background:#2F7BFF;animation:ping 1.8s ease-out infinite}
.mini{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.mini::-webkit-scrollbar{display:none}
.mc{flex:none;width:236px;text-align:left;padding:12px;border-radius:18px;background:var(--s1);border:1.5px solid var(--ln)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:11px;font-weight:700;color:var(--mu);text-align:center;padding:4px 0}
.cal .dy{height:44px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600;font-size:14px;gap:3px}
.cal .dy i{width:6px;height:6px;border-radius:3px;background:transparent}
.cal .dy.has i{background:var(--act)}
.cal .dy.today{box-shadow:inset 0 0 0 1.5px var(--ln)}
.cal .dy.past{color:var(--mu);opacity:.55}
.cal .dy.sel{background:var(--tx);color:var(--bg)}
.cal .dy.sel i{background:var(--ac)}
.row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--s1);border:1.5px solid var(--ln);text-align:left;width:100%}
.layer{position:absolute;inset:0;z-index:30}
.ov{position:absolute;inset:0;width:100%;background:var(--ov);animation:fade .25s ease both;border-radius:0}
.ov:active{transform:none}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;display:flex;flex-direction:column;background:var(--bg);border-radius:28px 28px 0 0;animation:shIn .36s cubic-bezier(.2,.8,.2,1) both;box-shadow:0 -10px 40px rgba(0,0,0,.3)}
.out.ov{animation:fadeOut .2s ease both}
.out.sheet{animation:shOut .22s ease-in both}
.grab{width:44px;height:5px;border-radius:3px;background:var(--ln);margin:10px auto 4px;flex:none}
.sb{overflow-y:auto;padding:8px 20px 28px;scrollbar-width:none}
.sb::-webkit-scrollbar{display:none}
.info{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln)}
.info .ic{color:var(--mu);margin-top:2px}
.box{border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px}
.box.ok{background:color-mix(in srgb,var(--ac) 16%,var(--s1));border:1.5px solid var(--ac)}
.box.no{background:color-mix(in srgb,var(--hot) 10%,var(--s1));border:1.5px solid var(--hot)}
.box.soft{background:var(--s1);border:1.5px solid var(--ln)}
.acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ab{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:16px;background:var(--s1);border:1.5px solid var(--ln);font-size:12px;font-weight:600;text-decoration:none;color:var(--tx)}
.ab.on{color:var(--hot)}
.big-ok{width:84px;height:84px;border-radius:28px;background:var(--ac);color:var(--acx);display:grid;place-items:center;animation:pop .6s cubic-bezier(.2,.8,.2,1) both}
.big-ok .ic{width:44px;height:44px;stroke-width:3}
.toast{position:absolute;left:16px;right:16px;bottom:24px;z-index:60;background:var(--tx);color:var(--bg);border-radius:16px;padding:14px 16px;font-weight:600;font-size:14px;animation:up .3s cubic-bezier(.2,.8,.2,1) both;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:14px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ac);color:var(--acx)}
.pill.wait{background:var(--s2);color:var(--mu)}
.pill.off{border:1.5px solid var(--hot);color:var(--hot)}
.stat{flex:1;border-radius:20px;background:var(--s1);border:1.5px solid var(--ln);padding:14px}
.stat b{display:block;font-size:30px;line-height:1;font-weight:800}
.sw{width:52px;height:32px;border-radius:16px;background:var(--s2);position:relative;flex:none;border:1.5px solid var(--ln)}
.sw i{position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:12px;background:var(--mu);transition:transform .25s cubic-bezier(.2,.8,.2,1),background-color .2s}
.sw.on{background:var(--ac);border-color:var(--ac)}
.sw.on i{transform:translateX(20px);background:var(--acx)}
.bottom{padding:12px 20px 24px;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hint{font-size:12px;color:var(--mu);margin-top:6px}
.irow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--ln);font-size:14px}
@media (prefers-reduced-motion:reduce){.app *,.app *::after{animation-duration:1ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>

<div class="acts">
<button type="button" class="ab {{pv.favCls}}" aria-pressed="{{pv.isFav}}" onClick="{{pv.tFav}}"><svg class="ic {{pv.heartCls}}" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>{{pv.favTx}}</button>
<button type="button" class="ab" onClick="{{pv.share}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><path d="M16 6l-4-4-4 4"></path><path d="M12 2v13"></path></svg>Enviar</button>
<button type="button" class="ab" onClick="{{pv.ics}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>Agenda</button>
<a class="ab" href="{{pv.lastHref}}" target="_blank" rel="noopener"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>{{pv.lastTx}}</a>
</div>
<sc-if value="{{pv.mine}}" hint-placeholder-val="{{false}}"><div class="box ok"><b>{{pv.mineTx}}</b><span style="font-size: 14px">{{pv.mineSub}}</span><button type="button" class="lnk" style="align-self: flex-start; font-size: 13px" onClick="{{toHist}}">Ver no histórico</button></div></sc-if>
<sc-if value="{{pv.formBtn}}" hint-placeholder-val="{{false}}"><a class="btn" href="{{pv.form}}" target="_blank" rel="noopener" style="text-decoration: none">Inscrição no formulário oficial<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"></path></svg></a></sc-if>
<sc-if value="{{pv.canAct}}" hint-placeholder-val="{{true}}"><button type="button" class="{{pv.ctaCls}}" onClick="{{pv.act}}" disabled="{{pv.dis}}">{{pv.cta}}</button></sc-if>
</div>
</sc-if>

<sc-if value="{{step.contact}}" hint-placeholder-val="{{false}}">
<div class="fade" style="display: flex; flex-direction: column; gap: 14px">
<div><span class="eyebrow">{{pv.club}}</span><h2 class="disp h2" style="margin-top: 4px">{{pv.ctaTitle}}</h2><p class="mu" style="margin: 6px 0 0; font-size: 14px">Só 2 dados. Eles vão apenas para este clube.</p></div>
<div class="field"><label class="lbl" for="dn">Nome do atleta</label><input id="dn" class="inp" value="{{draft.nome}}" onChange="{{dSet.nome}}" placeholder="Nome e sobrenome" autocomplete="name"></div>
<div class="field"><label class="lbl" for="dtel">WhatsApp (do responsável, se menor de 18)</label><input id="dtel" class="inp" inputmode="tel" value="{{draft.tel}}" onChange="{{dSet.tel}}" placeholder="(11) 90000-0000" autocomplete="tel"></div>
<div class="box soft" style="flex-direction: row; gap: 10px; font-size: 13px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg><span class="mu">Pedimos só o necessário. Se o atleta tiver menos de 18 anos, o responsável deve preencher e acompanhar o contato.</span></div>
<sc-if value="{{err}}" hint-placeholder-val="{{false}}"><p class="err fade" style="margin: 0">{{err}}</p></sc-if>
<div style="display: grid; grid-template-columns: 1fr 2fr; gap: 10px">
<button type="button" class="btn ghost" onClick="{{toInfo}}">Voltar</button>
<button type="button" class="btn" onClick="{{sendInt}}">Enviar</button>
</div>
</div>
</sc-if>

<sc-if value="{{step.done}}" hint-placeholder-val="{{false}}">
<div class="fade" style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; padding: 16px 0 4px">
<div class="big-ok"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg></div>
<h2 class="disp h2 in" style="font-size: 28px">{{doneTitle}}</h2>
<p class="mu in" style="margin: 0; animation-delay: .06s">{{doneTx}}</p>
<div class="in" style="display: flex; flex-direction: column; gap: 10px; width: 100%; animation-delay: .12s">
<button type="button" class="btn" onClick="{{pv.ics}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>Adicionar à agenda</button>
<button type="button" class="btn ghost" onClick="{{toHist}}">Ver meu histórico</button>
</div>
</div>
</sc-if>

</div>
</sc-if>

<!-- editor da peneira (administrador) -->
<sc-if value="{{sh.e}}" hint-placeholder-val="{{false}}">
<div class="fade" style="display: flex; flex-direction: column; gap: 14px">
<div><span class="eyebrow">Administrador</span><h2 class="disp h2" style="margin-top: 4px">{{ed.title}}</h2></div>
<div><span class="lbl">Origem</span><div class="seg"><sc-for list="{{ed.orig}}" as="o" hint-placeholder-count="2"><button type="button" class="{{o.cls}}" aria-pressed="{{o.on}}" onClick="{{o.pick}}">{{o.l}}</button></sc-for></div></div>
<div class="field"><label class="lbl" for="e-club">Clube</label><input id="e-club" class="inp" value="{{ed.v.club}}" onChange="{{ed.set.club}}" placeholder="Nome do clube"></div>
<div class="field"><label class="lbl" for="e-div">Descrição</label><input id="e-div" class="inp" value="{{ed.v.divisao}}" onChange="{{ed.set.divisao}}" placeholder="Ex.: Base masculina, Futsal feminino"></div>
<div><span class="lbl">Cidade</span><div class="chips"><sc-for list="{{ed.cities}}" as="c" hint-placeholder-count="8"><button type="button" class="{{c.cls}}" aria-pressed="{{c.on}}" onClick="{{c.pick}}">{{c.l}}</button></sc-for></div></div>
<div class="field"><label class="lbl" for="e-addr">Endereço</label><input id="e-addr" class="inp" value="{{ed.v.addr}}" onChange="{{ed.set.addr}}" placeholder="Local, rua e número"></div>
<div class="two">
<div class="field"><label class="lbl" for="e-data">Data</label><input id="e-data" class="inp" type="date" value="{{ed.v.data}}" onChange="{{ed.set.data}}"></div>
<div class="field"><label class="lbl" for="e-hora">Horário</label><input id="e-hora" class="inp" type="time" value="{{ed.v.hora}}" onChange="{{ed.set.hora}}"></div>
</div>
<div class="field"><label class="lbl" for="e-times">Horários por categoria (opcional)</label><input id="e-times" class="inp" value="{{ed.v.times}}" onChange="{{ed.set.times}}" placeholder="Sub-13: 12h; Sub-15 e Sub-17: 13h"></div>
<div>
<div class="two">
<div class="field"><label class="lbl" for="e-cmin">Categoria: de Sub-</label><input id="e-cmin" class="inp" type="number" inputmode="numeric" min="9" max="20" value="{{ed.v.cmin}}" onChange="{{ed.set.cmin}}"></div>
<div class="field"><label class="lbl" for="e-cmax">até Sub-</label><input id="e-cmax" class="inp" type="number" inputmode="numeric" min="9" max="20" value="{{ed.v.cmax}}" onChange="{{ed.set.cmax}}"></div>
</div>
<div class="hint">{{ed.catTx}}</div>
</div>
<div><span class="lbl">Gênero</span><div class="chips"><sc-for list="{{ed.gens}}" as="o" hint-placeholder-count="2"><button type="button" class="{{o.cls}}" aria-pressed="{{o.on}}" onClick="{{o.pick}}">{{o.l}}</button></sc-for></div></div>
<div><span class="lbl">Modalidade</span><div class="chips"><sc-for list="{{ed.mods}}" as="o" hint-placeholder-count="2"><button type="button" class="{{o.cls}}" aria-pressed="{{o.on}}" onClick="{{o.pick}}">{{o.l}}</button></sc-for></div></div>
<div>
<div class="two">
<div class="field"><label class="lbl" for="e-preco">Preço (R$)</label><input id="e-preco" class="inp" inputmode="decimal" value="{{ed.v.preco}}" onChange="{{ed.set.preco}}" placeholder="Não informado"></div>
<div class="field"><label class="lbl" for="e-tel">Telefone</label><input id="e-tel" class="inp" inputmode="tel" value="{{ed.v.tel}}" onChange="{{ed.set.tel}}" placeholder="(11) 90000-0000"></div>
</div>
<div class="hint">Preço 0 = grátis. Vazio = não informado.</div>
</div>
<div>
<div class="two">
<div class="field"><label class="lbl" for="e-vagas">Vagas abertas</label><input id="e-vagas" class="inp" type="number" inputmode="numeric" min="0" value="{{ed.v.vagas}}" onChange="{{ed.set.vagas}}" placeholder="Não informado"></div>
<div class="field"><label class="lbl" for="e-total">Total de vagas</label><input id="e-total" class="inp" type="number" inputmode="numeric" min="0" value="{{ed.v.total}}" onChange="{{ed.set.total}}" placeholder="Não informado"></div>
</div>
<div class="hint">{{ed.vagasTx}}</div>
</div>
<div class="field"><label class="lbl" for="e-req">O que levar</label><input id="e-req" class="inp" value="{{ed.v.req}}" onChange="{{ed.set.req}}" placeholder="Chuteira, caneleira, água e documento"></div>
<div class="field"><label class="lbl" for="e-prazo">Inscrições até (opcional)</label><input id="e-prazo" class="inp" type="date" value="{{ed.v.prazo}}" onChange="{{ed.set.prazo}}"></div>
<div>
<div class="two">
<div class="field"><label class="lbl" for="e-amin">Nascidos de (opcional)</label><input id="e-amin" class="inp" type="number" inputmode="numeric" value="{{ed.v.amin}}" onChange="{{ed.set.amin}}" placeholder="Ano"></div>
<div class="field"><label class="lbl" for="e-amax">até</label><input id="e-amax" class="inp" type="number" inputmode="numeric" value="{{ed.v.amax}}" onChange="{{ed.set.amax}}" placeholder="Ano"></div>
</div>
<div class="hint">Use quando o clube divulga anos de nascimento em vez de categoria.</div>
</div>
<div class="field"><label class="lbl" for="e-src">Link da fonte ou do formulário</label><input id="e-src" class="inp" type="url" inputmode="url" value="{{ed.v.src}}" onChange="{{ed.set.src}}" placeholder="https://"></div>
<div class="field"><label class="lbl" for="e-srctx">Sobre a fonte</label><input id="e-srctx" class="inp" value="{{ed.v.srcTx}}" onChange="{{ed.set.srcTx}}" placeholder="Ex.: Divulgada pelo clube no Instagram em 18/09."></div>
<button type="button" class="row" onClick="{{ed.tAtiva}}" aria-pressed="{{ed.v.ativa}}">
<span style="flex: 1"><b style="display: block">Visível no app</b><span class="mu" style="font-size: 13px">Desligue para esconder a peneira sem apagar</span></span>
<span class="sw {{ed.swCls}}"><i></i></span>
</button>
<sc-if value="{{ed.err}}" hint-placeholder-val="{{false}}"><p class="err fade" style="margin: 0">{{ed.err}}</p></sc-if>
<div style="display: grid; grid-template-columns: 1fr 2fr; gap: 10px">
<button type="button" class="btn ghost" onClick="{{closeSheet}}">Cancelar</button>
<button type="button" class="btn" onClick="{{ed.save}}" disabled="{{ed.busy}}">{{ed.saveTx}}</button>
</div>
<sc-if value="{{ed.canDel}}" hint-placeholder-val="{{false}}"><button type="button" class="btn ghost sm" style="color: var(--hot)" onClick="{{ed.del}}" disabled="{{ed.busy}}">{{ed.delTx}}</button></sc-if>
<sc-if value="{{ed.canDel}}" hint-placeholder-val="{{false}}">
<div class="box soft">
<b>{{ed.intsTitle}}</b>
<sc-for list="{{ed.ints}}" as="i" hint-placeholder-count="2">
<div class="irow"><span style="min-width: 0"><b style="display: block">{{i.nome}}</b><span class="mu" style="font-size: 12px">{{i.info}}</span></span><sc-if value="{{i.wa}}" hint-placeholder-val="{{true}}"><a class="lnk" style="font-size: 13px; white-space: nowrap" href="{{i.wa}}" target="_blank" rel="noopener">{{i.tel}}</a></sc-if></div>
</sc-for>
<sc-if value="{{ed.noInts}}" hint-placeholder-val="{{true}}"><span class="mu" style="font-size: 13px">Ninguém demonstrou interesse ainda.</span></sc-if>
</div>
</sc-if>
</div>
</sc-if>

<!-- filtros -->
<sc-if value="{{sh.f}}" hint-placeholder-val="{{false}}">
<div class="fade" style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; justify-content: space-between"><h2 class="disp h2">Filtros</h2><button type="button" class="lnk" onClick="{{clearSheet}}">Limpar</button></div>
<div><span class="lbl">Origem</span><div class="chips"><sc-for list="{{fSrc}}" as="o" hint-placeholder-count="3"><button type="button" class="{{o.cls}}" aria-pressed="{{o.on}}" onClick="{{o.pick}}">{{o.l}}</button></sc-for></div></div>
<div><span class="lbl">Distância</span><div class="chips"><sc-for list="{{fDist}}" as="o" hint-placeholder-count="6"><button type="button" class="{{o.cls}}" aria-pressed="{{o.on}}" onClick="{{o.pick}}">{{o.l}}</button></sc-for></div></div>
<div><span class="lbl">Categoria</span><div class="chips"><sc-for list="{{fCat}}" as="o" hint-placeholder-count="13"><button type="button" class="{{o.cls}}" aria-pressed="{{o.on}}" onClick="{{o.pick}}">{{o.l}}</button></sc-for></div></div>
<div><span class="lbl">Modalidade</span><div class="chips"><sc-for list="{{fMod}}" as="o" hint-placeholder-count="3"><button type="button" class="{{o.cls}}" aria-pressed="{{o.on}}" onClick="{{o.pick}}">{{o.l}}</button></sc-for></div></div>
<div><span class="lbl">Preço</span><div class="chips"><sc-for list="{{fPrice}}" as="o" hint-placeholder-count="2"><button type="button" class="{{o.cls}}" aria-pressed="{{o.on}}" onClick="{{o.pick}}">{{o.l}}</button></sc-for></div></div>
<div><span class="lbl">Ordenar por</span><div class="seg"><sc-for list="{{fSort}}" as="o" hint-placeholder-count="2"><button type="button" class="{{o.cls}}" aria-pressed="{{o.on}}" onClick="{{o.pick}}">{{o.l}}</button></sc-for></div></div>
<button type="button" class="btn" onClick="{{closeSheet}}">{{seeTx}}</button>
</div>
</sc-if>

<!-- notificações -->
<sc-if value="{{sh.n}}" hint-placeholder-val="{{false}}">
<div class="fade" style="display: flex; flex-direction: column; gap: 12px">
<h2 class="disp h2">Notificações</h2>
<button type="button" class="row" onClick="{{toggleAlerts}}" aria-pressed="{{alerts}}">
<span style="flex: 1"><b style="display: block">Alertas de novas peneiras</b><span class="mu" style="font-size: 13px">Avisar quando surgir peneira compatível perto de você</span></span>
<span class="sw {{swCls}}"><i></i></span>
</button>
<sc-for list="{{noteList}}" as="n" hint-placeholder-count="2">
<div class="row in" style="align-items: flex-start; animation-delay: {{n.delay}}">
<span style="width: 10px; height: 10px; border-radius: 5px; margin-top: 6px; flex: none; background: {{n.dotBg}}"></span>
<span style="flex: 1"><b style="display: block">{{n.t}}</b><span class="mu" style="font-size: 13px; display: block">{{n.x}}</span><span class="mu" style="font-size: 12px">{{n.ago}}</span></span>
</div>
</sc-for>
</div>
</sc-if>

</div>
</div>
</div>
</sc-if>

<sc-if value="{{toast}}" hint-placeholder-val="{{false}}"><div class="toast" role="status">{{toast}}</div></sc-if>
</div>
</template>
